name: Crypto TradeStation v4 Legacy Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy workflow notice
        run: |
          echo "The source-generating v4 workflow has been retired from automatic builds."
          echo "Use 'Canonicalize Crypto TradeStation v4.0.7' once to materialize v4.0.7."
          echo "After the canonicalization PR is merged, use 'Crypto TradeStation Canonical Android APK'."
          echo "Repository history retains the previous full migration workflow for audit/recovery."
