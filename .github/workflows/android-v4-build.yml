name: Crypto TradeStation v4 Canonical Update APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      run_tests:
        description: Run unit tests before APK build
        required: true
        default: true
        type: boolean
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: cts-v4-canonical-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  CTS_BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
  CTS_RUN_TESTS: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.run_tests }}
  CTS_VERSION_NAME: 4.0.5
  CTS_VERSION_CODE: 110
  CTS_DEBUG_CERT_SHA256: b690958cb434544e7f8963ecc86559562a82155ffbd915cb2088c9333e06aa28

jobs:
  build-v4:
    name: Build canonical CTS v4 update APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The diagnostics patch must run BEFORE Milestone 6. It updates both the
      # base source and migration-owned v4 overlays. Milestone 6 then copies the
      # patched overlays into app/, making those files the effective build source.
      - name: Apply diagnostics source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .cts-v4-migration/apply_diagnostics_integration_fix.py "$GITHUB_WORKSPACE" | tee diagnostics-fix.log

      - name: Apply cumulative v4 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .cts-v4-migration/apply_milestone6.py "$GITHUB_WORKSPACE" | tee migration.log

      - name: Apply full integration and UX cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 .cts-v4-migration/apply_full_integration_cleanup.py "$GITHUB_WORKSPACE" | tee integration-cleanup.log

      - name: Apply Kraken exchange minimum-order sizing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .cts-v4-migration/apply_exchange_minimum_order_fix.py
          python3 .cts-v4-migration/apply_exchange_minimum_order_fix.py "$GITHUB_WORKSPACE" | tee exchange-minimum-order-fix.log

      - name: Validate exchange minimum-order contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYMIN'
          from pathlib import Path
          controller = Path('app/src/main/java/com/ksp/cryptobot/core/BotController.kt').read_text(encoding='utf-8')
          policy = Path('app/src/main/java/com/ksp/cryptobot/execution/ExchangeMinimumOrderPolicy.kt').read_text(encoding='utf-8')
          tests = Path('app/src/test/java/com/ksp/cryptobot/execution/ExchangeMinimumOrderPolicyTest.kt').read_text(encoding='utf-8')
          checks = {
              'Kraken ordermin policy': 'minOrderSize' in policy and 'requiredMinimumQuantity' in policy,
              'Kraken costmin policy': 'minOrderCost' in policy and 'COST_MIN_BUFFER' in policy,
              'pre-risk safe minimum sizing': 'maxSpendableForExchangeMinimum' in controller and 'allowUpsizeToMinimum = true' in controller,
              'post-risk no-force-upsize': 'exchangeMinimumAfterRisk' in controller and 'allowUpsizeToMinimum = false' in controller,
              'final pre-submit defense': 'finalExchangeMinimumCheck' in controller,
              'minimum-failure Telegram spam guard': 'deterministicMinimumRejection' in controller,
              'NEAR regression test': 'nearEurThreePointSixSixIsRaisedToFourWhenSafe' in tests,
              'hard-cap regression test': 'exchangeMinimumDoesNotOverrideHardRiskCap' in tests,
              'reserve regression test': 'exchangeMinimumDoesNotSpendReservedCash' in tests,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' | ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Exchange minimum-order contract failure: ' + ', '.join(failed))
          PYMIN

      - name: Preflight exact-preview migration
        shell: bash
        run: |
          set -euo pipefail
          test -f .cts-v4-migration/apply_exact_preview_ui.py
          python3 -m py_compile .cts-v4-migration/apply_exact_preview_ui.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.cts-v4-migration/apply_exact_preview_ui.py')
          text = p.read_text(encoding='utf-8')
          required = [
              'PreviewReplicaUi.kt',
              'NewsProviderHealthRegistry',
              'PreviewNewsScreen',
              'PreviewBottomNavigation',
              'PreviewDashboardScreen',
              'PreviewSettingsScreen',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Exact-preview migration is incomplete: ' + ', '.join(missing))
          print(f'Exact-preview migration preflight PASS ({p.stat().st_size} bytes)')
          PY

      - name: Apply approved preview-exact UI redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 .cts-v4-migration/apply_exact_preview_ui.py "$GITHUB_WORKSPACE" | tee exact-preview-ui.log

      - name: Apply System diagnostics and export UI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .cts-v4-migration/apply_system_diagnostics_ui.py
          python3 .cts-v4-migration/apply_system_diagnostics_ui.py "$GITHUB_WORKSPACE" | tee system-diagnostics-ui.log

      - name: Apply GDELT request pacing and cache
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .cts-v4-migration/apply_gdelt_rate_limit_fix.py
          python3 .cts-v4-migration/apply_gdelt_rate_limit_fix.py "$GITHUB_WORKSPACE" | tee gdelt-rate-limit-fix.log

      - name: Validate GDELT request pacing contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYGDELT'
          from pathlib import Path
          text = Path('app/src/main/java/com/ksp/cryptobot/news/GdeltNewsClient.kt').read_text(encoding='utf-8')
          checks = {
              'global request spacing': 'MIN_REMOTE_INTERVAL_MS = 6_000L' in text,
              'per-symbol cache': 'CACHE_TTL_MS = 15L * 60L * 1000L' in text,
              'non-blocking scan': 'return@withContext decision.second.orEmpty()' in text,
              'bounded cache': 'MAX_CACHE_SYMBOLS = 500' in text,
              'stale fallback': 'STALE_CACHE_MAX_AGE_MS' in text,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' | ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('GDELT pacing contract failed: ' + ', '.join(failed))
          PYGDELT

      - name: Validate System diagnostics contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDIAG'
          from pathlib import Path
          root = Path('app/src/main/java/com/ksp/cryptobot')
          main = (root/'MainActivity.kt').read_text(encoding='utf-8')
          ui = (root/'PreviewReplicaUi.kt').read_text(encoding='utf-8')
          controller = (root/'core/BotController.kt').read_text(encoding='utf-8')
          store = (root/'settings/AppSettingsStore.kt').read_text(encoding='utf-8')
          checks = {
              'System segment works': 'if (it == 1) onOpen(AppTab.SYSTEM_TEST)' in ui,
              'Backup segment works': 'if (it == 0) onOpen(AppTab.BACKUP)' in ui,
              'diagnostics folder picker': 'Select Diagnostics Folder' in ui,
              'diagnostics selected folder used immediately': 'selectedDiagnosticsDirectory by remember(diagnosticsDirectoryPath)' in ui and 'onRunAndSave(selectedDiagnosticsDirectory)' in ui,
              'backup selected folder used immediately': 'selectedBackupDirectory by remember(backupDirectoryPath)' in ui and 'onExportFullBackup(selectedBackupDirectory)' in ui,
              'diagnostics export button': 'Run & Save Full Diagnostics' in ui,
              'diagnostics path persistence': 'diagnosticsDirectoryPath()' in store,
              'full diagnostics exporter': 'exportFullDiagnosticsToFile' in controller,
              'secret redaction': 'secrets=EXCLUDED_AND_REDACTED' in controller,
              'runtime status included': '[RECENT_STATUS_LOG]' in controller,
              'portfolio included': '[PORTFOLIO]' in controller,
              'positions included': '[LIFECYCLE_POSITIONS]' in controller,
              'orders included': '[OPEN_ORDERS]' in controller,
              'trades included': '[RECENT_TRADES]' in controller,
              'provider health included': '[NEWS_PROVIDER_HEALTH]' in controller,
              'MainActivity wired': 'diagnosticsDirectoryPath = store.diagnosticsDirectoryPath()' in main,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' | ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('System diagnostics contract failure: ' + ', '.join(failed))
          PYDIAG

      - name: Validate preview visual contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee preview-visual-contracts.log
          from pathlib import Path

          main = Path('app/src/main/java/com/ksp/cryptobot/MainActivity.kt').read_text(encoding='utf-8')
          ui = Path('app/src/main/java/com/ksp/cryptobot/PreviewReplicaUi.kt').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')

          checks = {
              'approved fixed bottom navigation': 'PreviewBottomNavigation(currentTab = currentTab' in main,
              'approved compact top bar': 'PreviewAppTopBar(' in main,
              'dashboard preview screen': 'AppTab.DASHBOARD -> PreviewDashboardScreen' in main,
              'portfolio preview screen': 'AppTab.PORTFOLIO -> PreviewPortfolioScreen' in main,
              'AI & Research preview screen': 'AppTab.AI -> PreviewAiHubScreen' in main,
              'News & Intelligence preview screen': 'AppTab.NEWS -> PreviewNewsScreen' in main,
              'single Settings preview screen': 'AppTab.SETTINGS -> PreviewSettingsScreen' in main,
              'System Test preview screen': 'AppTab.SYSTEM_TEST -> PreviewSystemTestScreen' in main,
              'System segment navigation works': 'if (it == 1) onOpen(AppTab.SYSTEM_TEST)' in ui,
              'full diagnostics export UI': 'Run & Save Full Diagnostics' in ui and 'Select Diagnostics Folder' in ui,
              'selected export folder used immediately': 'onRunAndSave(selectedDiagnosticsDirectory)' in ui and 'onExportFullBackup(selectedBackupDirectory)' in ui,
              'hamburger quick navigation works': 'DropdownMenu(' in ui and 'Quick Navigation' in ui,
              'Active Positions preview screen': 'AppTab.POSITIONS -> PreviewPositionsScreen' in main,
              'Backup & Recovery preview screen': 'AppTab.BACKUP -> PreviewBackupRecoveryScreen' in main,
              'AI signal detail preview screen': 'AppTab.AI_SIGNAL_DETAIL -> PreviewAiSignalDetailScreen' in main,
              'line/area graph': 'PreviewAreaSparkline' in ui,
              'allocation donut': 'AssetAllocationDonut' in ui,
              'confidence gauge': 'PreviewConfidenceGauge' in ui,
              'purple accent': '0xFF8B5CF6' in ui,
              'green accent': '0xFF62DE67' in ui,
              'card background': '0xFF141D2A' in ui,
              'navy background': '0xFF0C1522' in ui,
              'real data not mock portfolio balance': '14582.36' not in ui and '327.64' not in ui,
              'material icons available': 'material-icons-extended' in gradle,
              'deep screens share compact 8dp cards': 'Column(modifier = Modifier.padding(11.dp), verticalArrangement = Arrangement.spacedBy(7.dp), content = content)' in main,
              'deep settings use green switches': 'checkedTrackColor = Mint' in main and 'SwitchDefaults.colors' in main,
              'legacy hero gradients removed': 'Brush.linearGradient(listOf(Color(0xFF14345F)' not in main,
              'legacy GlassCard uses compact padding': 'Column(modifier = Modifier.padding(11.dp), verticalArrangement = Arrangement.spacedBy(7.dp), content = content)' in main,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' | ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Preview visual contract failure: ' + ', '.join(failed))
          PY

      - name: Validate integration contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee integration-contracts.log
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/ksp/cryptobot/MainActivity.kt').read_text(encoding='utf-8')
          ui = Path('app/src/main/java/com/ksp/cryptobot/PreviewReplicaUi.kt').read_text(encoding='utf-8')
          lifecycle = Path('app/src/main/java/com/ksp/cryptobot/lifecycle/TradeLifecycleManager.kt').read_text(encoding='utf-8')
          controller = Path('app/src/main/java/com/ksp/cryptobot/core/BotController.kt').read_text(encoding='utf-8')
          models = Path('app/src/main/java/com/ksp/cryptobot/core/Models.kt').read_text(encoding='utf-8')
          store = Path('app/src/main/java/com/ksp/cryptobot/settings/AppSettingsStore.kt').read_text(encoding='utf-8')

          checks = {
              'single top-level settings/navigation architecture': 'V4_SYSTEMS' not in main and 'Settings Truth' not in main,
              'research owned by AI': 'AppTab.RESEARCH_SETTINGS -> V4ResearchPanel()' in main,
              'CloudShare owned by Settings/Backup': 'AppTab.CLOUDSHARE_SETTINGS -> CloudShareScreen()' in main,
              'recovery owned by Settings/Backup': 'AppTab.RECOVERY_TOOLS -> V4RecoveryPanel()' in main,
              'AVOID is not SELL': 'explicitSignalSell = isExplicitLifecycleSell(decision)' in lifecycle and 'SignalAction.AVOID ||' not in lifecycle,
              'soft signal churn protection': 'Soft SELL deferred to prevent churn' in lifecycle,
              'same-scan buy/sell context': 'enteredSymbolsThisScan' in controller and 'exitedSymbolsThisScan' in controller,
              'confirmed-fill lifecycle accounting': 'Lifecycle SELL accepted without confirmed fill' in lifecycle,
              'reopened position entry reset': 'latestBuyIsNewLifecycle' in lifecycle and 'reopenedByLatestBuy' in lifecycle,
              'provider health belongs to News': 'NewsProviderHealthRegistry.snapshot()' in ui and 'PreviewNewsScreen' in ui,
              'verified settings save/reload': 'lastSaveVerification()' in store and 'return exactMatch' in store,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' | ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Integration contract failure: ' + ', '.join(failed))

          # Audit every BotSettings field for round-trip persistence. All misses are
          # printed. Safety/execution critical misses fail the build.
          bot_match = re.search(r'data class BotSettings\((.*?)\n\)', models, re.S)
          if not bot_match:
              raise SystemExit('Could not parse BotSettings constructor for persistence audit')
          model_block = bot_match.group(1)
          fields = re.findall(r'(?m)^\s*val\s+([A-Za-z][A-Za-z0-9_]*)\s*:', model_block)
          load_block = store.split('fun load(): BotSettings', 1)[1].split('fun save(', 1)[0]
          if 'fun save(settings: BotSettings): Boolean' in store:
              save_block = store.split('fun save(settings: BotSettings): Boolean', 1)[1].split('fun lastSaveVerification', 1)[0]
          else:
              save_block = store.split('fun save(settings: BotSettings)', 1)[1].split('fun lastSaveVerification', 1)[0]
          missing_load = [f for f in fields if re.search(r'\b' + re.escape(f) + r'\s*=', load_block) is None]
          missing_save = [f for f in fields if ('settings.' + f) not in save_block]
          print(f'SETTINGS_AUDIT | fields={len(fields)} missingLoad={len(missing_load)} missingSave={len(missing_save)}')
          if missing_load:
              print('WARN | BotSettings missing from load: ' + ', '.join(missing_load))
          if missing_save:
              print('WARN | BotSettings missing from save: ' + ', '.join(missing_save))
          critical = {
              'mode','exchangeProvider','liveTradingAcknowledged','maxPositionEur','maxDailyLossEur',
              'maxTradesPerDay','maxTradesPerHour','maxSimultaneousLivePositions','cooldownAfterBuyMinutes',
              'cooldownAfterSellMinutes','forceSellOnBearishSignal','liveLifecycleManagerEnabled','autoExitManagerEnabled',
              'autoStopLossEnabled','autoTakeProfitEnabled','useNewsAi','trueSelfLearningEnabled','enableAutoSafeMode'
          }
          critical_missing = sorted((set(missing_load) | set(missing_save)) & critical)
          if critical_missing:
              raise SystemExit('Critical settings are not round-trip persisted: ' + ', '.join(critical_missing))
          PY

      - name: Validate diagnostics patch markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              'safe mode patch in migration overlay': 'causativeErrorTypes' in Path('.cts-v4-migration/app/src/main/java/com/ksp/cryptobot/governance/RiskBudgetAndSafeMode.kt').read_text(encoding='utf-8'),
              'safe mode patch in effective app': 'causativeErrorTypes' in Path('app/src/main/java/com/ksp/cryptobot/governance/RiskBudgetAndSafeMode.kt').read_text(encoding='utf-8'),
              'M3 entry-only governors in migration overlay': 'entryOnlyGovernorsBlock' in Path('.cts-v4-migration/app/src/main/java/com/ksp/cryptobot/governance/ProductionIntelligenceEngine.kt').read_text(encoding='utf-8'),
              'M3 entry-only governors in effective app': 'entryOnlyGovernorsBlock' in Path('app/src/main/java/com/ksp/cryptobot/governance/ProductionIntelligenceEngine.kt').read_text(encoding='utf-8'),
              'M4 entry-only safe-mode guard in migration overlay': 'productionSafeModeBlocks' in Path('.cts-v4-migration/app/src/main/java/com/ksp/cryptobot/execution/ExecutionGuard.kt').read_text(encoding='utf-8'),
              'M4 entry-only safe-mode guard in effective app': 'productionSafeModeBlocks' in Path('app/src/main/java/com/ksp/cryptobot/execution/ExecutionGuard.kt').read_text(encoding='utf-8'),
              'news provider health registry': Path('app/src/main/java/com/ksp/cryptobot/news/NewsProviderHealth.kt').exists(),
              'completed learning outcomes': 'completedOutcomeTradesForLearning' in Path('app/src/main/java/com/ksp/cryptobot/learning/TrueSelfLearningEngine.kt').read_text(encoding='utf-8'),
              'end-to-end verifier in migration overlay': 'End-to-end wiring evidence' in Path('.cts-v4-migration/app/src/main/java/com/ksp/cryptobot/release/V4SystemVerifier.kt').read_text(encoding='utf-8'),
              'end-to-end verifier in effective app': 'End-to-end wiring evidence' in Path('app/src/main/java/com/ksp/cryptobot/release/V4SystemVerifier.kt').read_text(encoding='utf-8'),
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' | ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Diagnostics patch validation failed: ' + ', '.join(failed))
          PY

      - name: Set update build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version_name = "4.0.5"
          version_code = 110

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          text, n1 = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', text, count=1)
          text, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', f'versionName = "{version_name}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not patch app version identity")
          gradle.write_text(text, encoding="utf-8")

          release_info = Path("app/src/main/java/com/ksp/cryptobot/release/V4ReleaseInfo.kt")
          text = release_info.read_text(encoding="utf-8")
          text, n1 = re.subn(r'const val VERSION_NAME\s*=\s*"[^"]+"', f'const val VERSION_NAME = "{version_name}"', text, count=1)
          text, n2 = re.subn(r'const val VERSION_CODE\s*=\s*\d+', f'const val VERSION_CODE = {version_code}', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not patch V4ReleaseInfo")
          release_info.write_text(text, encoding="utf-8")

          main = Path("app/src/main/java/com/ksp/cryptobot/MainActivity.kt")
          if main.exists():
              text = main.read_text(encoding="utf-8").replace("v4.0.0 CTS", "v4.0.5 CTS")
              main.write_text(text, encoding="utf-8")

          print(f"Canonical update identity set: {version_name} ({version_code})")
          PY

      - name: Add JUnit 4 test dependency when missing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          dep = '    testImplementation("junit:junit:4.13.2")\n'
          if 'testImplementation("junit:junit:4.13.2")' not in text:
              marker = 'dependencies {\n'
              if marker not in text:
                  raise SystemExit('dependencies block not found in app/build.gradle.kts')
              text = text.replace(marker, marker + dep, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate migrated update source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          db = Path('app/src/main/java/com/ksp/cryptobot/data/AppDatabase.kt').read_text(encoding='utf-8')
          release = Path('app/src/main/java/com/ksp/cryptobot/release/V4ReleaseInfo.kt').read_text(encoding='utf-8')
          checks = {
              'applicationId com.ksp.cryptobot': 'applicationId = "com.ksp.cryptobot"' in gradle,
              'versionName 4.0.5': 'versionName = "4.0.5"' in gradle,
              'versionCode 110': 'versionCode = 110' in gradle,
              'V4ReleaseInfo 4.0.5': 'VERSION_NAME = "4.0.5"' in release and 'VERSION_CODE = 110' in release,
              'Room schema 11': 'version = 11' in db,
              'non-destructive Room': re.search(r'(?m)^\s*\.fallbackToDestructiveMigration\s*\(', db) is None,
              'research handoff': Path('app/src/main/java/com/ksp/cryptobot/research/ResearchHandoffEngine.kt').exists(),
              'protective stops': Path('app/src/main/java/com/ksp/cryptobot/execution/ProtectiveStopManager.kt').exists(),
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' | ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Migration/update validation failed: ' + ', '.join(failed))
          PY

      - name: Prepare release signing
        if: env.CTS_BUILD_TYPE == 'release'
        shell: bash
        env:
          CTS_RELEASE_KEYSTORE_B64: ${{ secrets.CTS_RELEASE_KEYSTORE_B64 }}
          CTS_RELEASE_STORE_PASSWORD: ${{ secrets.CTS_RELEASE_STORE_PASSWORD }}
          CTS_RELEASE_KEY_ALIAS: ${{ secrets.CTS_RELEASE_KEY_ALIAS }}
          CTS_RELEASE_KEY_PASSWORD: ${{ secrets.CTS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CTS_RELEASE_KEYSTORE_B64 CTS_RELEASE_STORE_PASSWORD CTS_RELEASE_KEY_ALIAS CTS_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          mkdir -p .github-ci
          printf '%s' "$CTS_RELEASE_KEYSTORE_B64" | base64 --decode > .github-ci/release.jks
          {
            printf 'storeFile=../.github-ci/release.jks\n'
            printf 'storePassword=%s\n' "$CTS_RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$CTS_RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$CTS_RELEASE_KEY_PASSWORD"
          } > signing.properties
          chmod 600 signing.properties .github-ci/release.jks

      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin 2>&1 | tee compile-debug.log

      - name: Run v4 unit tests
        if: env.CTS_RUN_TESTS == 'true'
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee unit-tests.log

      - name: Build canonical APK
        shell: bash
        run: |
          set -o pipefail
          if [ "$CTS_BUILD_TYPE" = "release" ]; then
            gradle --no-daemon :app:assembleRelease 2>&1 | tee apk-build.log
          else
            gradle --no-daemon :app:assembleDebug 2>&1 | tee apk-build.log
          fi

      - name: Verify update identity and signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          if [ "$CTS_BUILD_TYPE" = "release" ]; then
            APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          else
            APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          fi
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "APK output not found." >&2
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee ci-output/apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 1 | tee ci-output/apk-package.txt

          CERT="$(grep -i 'Signer #1 certificate SHA-256 digest:' ci-output/apk-signature.txt | head -n 1 | sed 's/.*digest:[[:space:]]*//' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ -z "$CERT" ]; then
            echo "Could not read APK signer SHA-256." >&2
            exit 1
          fi

          PACKAGE_LINE="$(cat ci-output/apk-package.txt)"
          echo "$PACKAGE_LINE" | grep -q "name='com.ksp.cryptobot'" || { echo "Wrong applicationId in built APK" >&2; exit 1; }
          echo "$PACKAGE_LINE" | grep -q "versionCode='110'" || { echo "Wrong versionCode in built APK" >&2; exit 1; }
          echo "$PACKAGE_LINE" | grep -q "versionName='4.0.5'" || { echo "Wrong versionName in built APK" >&2; exit 1; }

          if [ "$CTS_BUILD_TYPE" = "debug" ]; then
            EXPECTED="$(echo "$CTS_DEBUG_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            if [ "$CERT" != "$EXPECTED" ]; then
              echo "Debug APK signer mismatch. expected=$EXPECTED actual=$CERT" >&2
              exit 1
            fi
            echo "PASS: debug APK uses stable CTS update signer $CERT"
          else
            echo "Release signer=$CERT (release updates require the installed app to use this same release lineage)."
          fi

          OUT="ci-output/CryptoTradeStation-v${CTS_VERSION_NAME}-${CTS_BUILD_TYPE}-update.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee ci-output/SHA256SUMS.txt
          {
            echo "applicationId=com.ksp.cryptobot"
            echo "versionName=$CTS_VERSION_NAME"
            echo "versionCode=$CTS_VERSION_CODE"
            echo "roomSchema=11"
            echo "buildType=$CTS_BUILD_TYPE"
            echo "signerSha256=$CERT"
            echo "expectedStableDebugSigner=$CTS_DEBUG_CERT_SHA256"
            echo "commit=$GITHUB_SHA"
            echo "runId=$GITHUB_RUN_ID"
            echo "runNumber=$GITHUB_RUN_NUMBER"
            echo "canonicalUpdateArtifact=true"
          } > ci-output/INSTALL_IDENTITY.txt

      - name: Upload canonical CTS update APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoTradeStation-v4.0.5-${{ env.CTS_BUILD_TYPE }}-update-apk
          path: ci-output/
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p ci-failure
          cp migration.log diagnostics-fix.log integration-cleanup.log exchange-minimum-order-fix.log exact-preview-ui.log system-diagnostics-ui.log preview-visual-contracts.log integration-contracts.log compile-debug.log unit-tests.log apk-build.log ci-failure/ 2>/dev/null || true
          git diff --stat > ci-failure/git-diff-stat.txt 2>&1 || true
          git diff --name-only > ci-failure/git-diff-files.txt 2>&1 || true
          java -version > ci-failure/java-version.txt 2>&1 || true
          gradle --version > ci-failure/gradle-version.txt 2>&1 || true
          # Never collect signing.properties, keystores, Actions secrets, local.properties or app data.

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoTradeStation-v4-build-failure-${{ github.run_number }}
          path: ci-failure/
          if-no-files-found: warn
          retention-days: 14
