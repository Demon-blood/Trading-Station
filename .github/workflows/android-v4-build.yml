name: Crypto TradeStation v4 Canonical Update APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      run_tests:
        description: Run unit tests before APK build
        required: true
        default: true
        type: boolean
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: cts-v4-canonical-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  CTS_BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
  CTS_RUN_TESTS: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.run_tests }}
  CTS_VERSION_NAME: 4.0.1
  CTS_VERSION_CODE: 106
  CTS_DEBUG_CERT_SHA256: b690958cb434544e7f8963ecc86559562a82155ffbd915cb2088c9333e06aa28

jobs:
  build-v4:
    name: Build canonical CTS v4 update APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply cumulative v4 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .cts-v4-migration/apply_milestone6.py "$GITHUB_WORKSPACE" | tee migration.log

      - name: Set update build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version_name = "4.0.1"
          version_code = 106

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          text, n1 = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', text, count=1)
          text, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', f'versionName = "{version_name}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not patch app version identity")
          gradle.write_text(text, encoding="utf-8")

          release_info = Path("app/src/main/java/com/ksp/cryptobot/release/V4ReleaseInfo.kt")
          text = release_info.read_text(encoding="utf-8")
          text, n1 = re.subn(r'const val VERSION_NAME\s*=\s*"[^"]+"', f'const val VERSION_NAME = "{version_name}"', text, count=1)
          text, n2 = re.subn(r'const val VERSION_CODE\s*=\s*\d+', f'const val VERSION_CODE = {version_code}', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not patch V4ReleaseInfo")
          release_info.write_text(text, encoding="utf-8")

          main = Path("app/src/main/java/com/ksp/cryptobot/MainActivity.kt")
          if main.exists():
              text = main.read_text(encoding="utf-8").replace("v4.0.0 CTS", "v4.0.1 CTS")
              main.write_text(text, encoding="utf-8")

          print(f"Canonical update identity set: {version_name} ({version_code})")
          PY

      - name: Add JUnit 4 test dependency when missing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          dep = '    testImplementation("junit:junit:4.13.2")\n'
          if 'testImplementation("junit:junit:4.13.2")' not in text:
              marker = 'dependencies {\n'
              if marker not in text:
                  raise SystemExit('dependencies block not found in app/build.gradle.kts')
              text = text.replace(marker, marker + dep, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate migrated update source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          db = Path('app/src/main/java/com/ksp/cryptobot/data/AppDatabase.kt').read_text(encoding='utf-8')
          release = Path('app/src/main/java/com/ksp/cryptobot/release/V4ReleaseInfo.kt').read_text(encoding='utf-8')
          checks = {
              'applicationId com.ksp.cryptobot': 'applicationId = "com.ksp.cryptobot"' in gradle,
              'versionName 4.0.1': 'versionName = "4.0.1"' in gradle,
              'versionCode 106': 'versionCode = 106' in gradle,
              'V4ReleaseInfo 4.0.1': 'VERSION_NAME = "4.0.1"' in release and 'VERSION_CODE = 106' in release,
              'Room schema 11': 'version = 11' in db,
              'non-destructive Room': re.search(r'(?m)^\s*\.fallbackToDestructiveMigration\s*\(', db) is None,
              'research handoff': Path('app/src/main/java/com/ksp/cryptobot/research/ResearchHandoffEngine.kt').exists(),
              'protective stops': Path('app/src/main/java/com/ksp/cryptobot/execution/ProtectiveStopManager.kt').exists(),
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' | ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Migration/update validation failed: ' + ', '.join(failed))
          PY

      - name: Prepare release signing
        if: env.CTS_BUILD_TYPE == 'release'
        shell: bash
        env:
          CTS_RELEASE_KEYSTORE_B64: ${{ secrets.CTS_RELEASE_KEYSTORE_B64 }}
          CTS_RELEASE_STORE_PASSWORD: ${{ secrets.CTS_RELEASE_STORE_PASSWORD }}
          CTS_RELEASE_KEY_ALIAS: ${{ secrets.CTS_RELEASE_KEY_ALIAS }}
          CTS_RELEASE_KEY_PASSWORD: ${{ secrets.CTS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in CTS_RELEASE_KEYSTORE_B64 CTS_RELEASE_STORE_PASSWORD CTS_RELEASE_KEY_ALIAS CTS_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          mkdir -p .github-ci
          printf '%s' "$CTS_RELEASE_KEYSTORE_B64" | base64 --decode > .github-ci/release.jks
          {
            printf 'storeFile=../.github-ci/release.jks\n'
            printf 'storePassword=%s\n' "$CTS_RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$CTS_RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$CTS_RELEASE_KEY_PASSWORD"
          } > signing.properties
          chmod 600 signing.properties .github-ci/release.jks

      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin 2>&1 | tee compile-debug.log

      - name: Run v4 unit tests
        if: env.CTS_RUN_TESTS == 'true'
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee unit-tests.log

      - name: Build canonical APK
        shell: bash
        run: |
          set -o pipefail
          if [ "$CTS_BUILD_TYPE" = "release" ]; then
            gradle --no-daemon :app:assembleRelease 2>&1 | tee apk-build.log
          else
            gradle --no-daemon :app:assembleDebug 2>&1 | tee apk-build.log
          fi

      - name: Verify update identity and signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          if [ "$CTS_BUILD_TYPE" = "release" ]; then
            APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          else
            APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          fi
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "APK output not found." >&2
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee ci-output/apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 1 | tee ci-output/apk-package.txt

          CERT="$(grep -i 'Signer #1 certificate SHA-256 digest:' ci-output/apk-signature.txt | head -n 1 | sed 's/.*digest:[[:space:]]*//' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ -z "$CERT" ]; then
            echo "Could not read APK signer SHA-256." >&2
            exit 1
          fi

          PACKAGE_LINE="$(cat ci-output/apk-package.txt)"
          echo "$PACKAGE_LINE" | grep -q "name='com.ksp.cryptobot'" || { echo "Wrong applicationId in built APK" >&2; exit 1; }
          echo "$PACKAGE_LINE" | grep -q "versionCode='106'" || { echo "Wrong versionCode in built APK" >&2; exit 1; }
          echo "$PACKAGE_LINE" | grep -q "versionName='4.0.1'" || { echo "Wrong versionName in built APK" >&2; exit 1; }

          if [ "$CTS_BUILD_TYPE" = "debug" ]; then
            EXPECTED="$(echo "$CTS_DEBUG_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            if [ "$CERT" != "$EXPECTED" ]; then
              echo "Debug APK signer mismatch. expected=$EXPECTED actual=$CERT" >&2
              exit 1
            fi
            echo "PASS: debug APK uses stable CTS update signer $CERT"
          else
            echo "Release signer=$CERT (release updates require the installed app to use this same release lineage)."
          fi

          OUT="ci-output/CryptoTradeStation-v${CTS_VERSION_NAME}-${CTS_BUILD_TYPE}-update.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee ci-output/SHA256SUMS.txt
          {
            echo "applicationId=com.ksp.cryptobot"
            echo "versionName=$CTS_VERSION_NAME"
            echo "versionCode=$CTS_VERSION_CODE"
            echo "roomSchema=11"
            echo "buildType=$CTS_BUILD_TYPE"
            echo "signerSha256=$CERT"
            echo "expectedStableDebugSigner=$CTS_DEBUG_CERT_SHA256"
            echo "commit=$GITHUB_SHA"
            echo "runId=$GITHUB_RUN_ID"
            echo "runNumber=$GITHUB_RUN_NUMBER"
            echo "canonicalUpdateArtifact=true"
          } > ci-output/INSTALL_IDENTITY.txt

      - name: Upload canonical CTS update APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoTradeStation-v4.0.1-${{ env.CTS_BUILD_TYPE }}-update-apk
          path: ci-output/
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p ci-failure
          cp migration.log compile-debug.log unit-tests.log apk-build.log ci-failure/ 2>/dev/null || true
          git diff --stat > ci-failure/git-diff-stat.txt 2>&1 || true
          git diff --name-only > ci-failure/git-diff-files.txt 2>&1 || true
          java -version > ci-failure/java-version.txt 2>&1 || true
          gradle --version > ci-failure/gradle-version.txt 2>&1 || true
          # Never collect signing.properties, keystores, Actions secrets, local.properties or app data.

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoTradeStation-v4-build-failure-${{ github.run_number }}
          path: ci-failure/
          if-no-files-found: warn
          retention-days: 14
