name: Canonicalize Crypto TradeStation v4.0.7

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cts-canonicalize-v407
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  CTS_VERSION_NAME: 4.0.7
  CTS_VERSION_CODE: 112

jobs:
  canonicalize:
    name: Materialize, test, branch and PR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Materialize current effective v4.0.7 source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/canonicalize_v407.py "$GITHUB_WORKSPACE" | tee canonicalize.log

      - name: Verify committed-source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_canonical_v407.py "$GITHUB_WORKSPACE" | tee canonical-verify.log

      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin 2>&1 | tee compile-debug.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee unit-tests.log

      - name: Build verification APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee apk-build.log

      - name: Show materialization diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          git diff --name-only > canonicalized-files.txt
          cat canonicalized-files.txt

      - name: Create canonicalization branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="migration/canonical-v4.0.7-${GITHUB_RUN_NUMBER}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Only app/ should contain generated source changes.
          # The tools/workflows were already committed in the bootstrap commit.
          git add app
          if git diff --cached --quiet; then
            echo "No canonical source changes were produced." >&2
            exit 1
          fi

          git commit -m "Canonicalize Crypto TradeStation v4.0.7 source"
          git push --set-upstream origin "$BRANCH"

      - name: Create pull request
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH_NAME" \
            --title "Canonicalize Crypto TradeStation v4.0.7 source" \
            --body-file - <<'EOF'
          ## Crypto TradeStation v4.0.7 canonical source migration

          This PR freezes the effective Android source that the previous canonical
          GitHub Actions workflow generated at build time.

          ### Preserved
          - existing Kraken/order behavior
          - PAPER/LIVE/SHADOW/BACKTEST domains
          - risk/execution protections
          - current v4.0.7 UI
          - CloudShare/research/news integrations
          - Room schema 11
          - existing unit-test contracts

          ### Structural change
          `app/` is now the source of truth. The normal Android build no longer
          needs Python migration scripts to rewrite Kotlin before compilation.

          The PR branch was compiled, unit-tested and assembled by the
          `Canonicalize Crypto TradeStation v4.0.7` workflow before this PR was opened.
          EOF

      - name: PR fallback instructions
        if: steps.pr.outcome != 'success'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          echo "::warning::The branch was pushed successfully but GitHub did not allow the workflow token to create a PR."
          echo "::warning::Open a PR in GitHub from $BRANCH_NAME into $GITHUB_REF_NAME."
          echo "This can happen when 'Allow GitHub Actions to create and approve pull requests' is disabled in repository Actions settings."

      - name: Upload canonicalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-v4.0.7-canonicalization-evidence-${{ github.run_number }}
          path: |
            canonicalize.log
            canonical-verify.log
            compile-debug.log
            unit-tests.log
            apk-build.log
            canonicalized-files.txt
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
