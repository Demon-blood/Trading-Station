name: M22 Security API-Key Permissions & Release Integrity

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: cts-m22-security-release-integrity
  cancel-in-progress: false

jobs:
  m22:
    name: Patch, supply-chain scan, verify, compile, test and branch
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main" || {
            echo "M22 must be launched with Run workflow -> main. Current ref=$GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          [ -x "$SDKMANAGER" ] || {
            echo "sdkmanager missing" >&2
            exit 1
          }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Require merged M21 source
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/verify_m21_chaos_recovery.py || {
            echo "M21 verifier is missing from main." >&2
            exit 1
          }
          python3 tools/verify_m21_chaos_recovery.py "$GITHUB_WORKSPACE" | tee m21-prerequisite.log

      - name: Require protected workflow bootstrap on main
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/android-release-apk.yml || {
            echo "Missing bootstrapped .github/workflows/android-release-apk.yml" >&2
            exit 1
          }
          test -s .github/workflows/osv-scanner.yml || {
            echo "Missing bootstrapped .github/workflows/osv-scanner.yml" >&2
            exit 1
          }
          grep -q 'ANDROID_EXPECTED_CERT_SHA256' .github/workflows/android-release-apk.yml
          grep -q 'verify --verbose --print-certs' .github/workflows/android-release-apk.yml
          grep -q 'releaseRuntimeClasspath' .github/workflows/osv-scanner.yml
          grep -q -- '--lockfile=osv-scanner:build/m22-runtime-osv-scanner.json' .github/workflows/osv-scanner.yml

      - name: Apply M22
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_m22_security_release_integrity.py "$GITHUB_WORKSPACE" | tee m22-apply.log

      - name: Generate Gradle SHA-256 verification metadata
        shell: bash
        run: |
          set -o pipefail
          mkdir -p gradle
          rm -f gradle/verification-metadata.xml
          gradle --no-daemon --write-verification-metadata sha256 :app:compileDebugKotlin 2>&1 \
            | tee dependency-verification-bootstrap.log
          test -s gradle/verification-metadata.xml
          grep -q '<sha256 value=' gradle/verification-metadata.xml

      - name: Export release runtime dependency coordinates
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/m22-runtime-dependencies.init.gradle" <<'EOF'
          gradle.afterProject { project, state ->
              if (project.path == ":app") {
                  project.tasks.register("exportM22ReleaseRuntimeCoordinates") {
                      doLast {
                          def configuration = project.configurations.getByName("releaseRuntimeClasspath")
                          def coordinates = configuration.incoming.resolutionResult.allComponents
                              .collect { component ->
                                  def mv = component.moduleVersion
                                  if (mv == null) return null
                                  if (!mv.group || !mv.name || !mv.version) return null
                                  return "${mv.group}:${mv.name}:${mv.version}"
                              }
                              .findAll { it != null }
                              .toSet()
                              .toList()
                              .sort()

                          def output = new File(
                              project.rootProject.projectDir,
                              "build/m22-release-runtime-coordinates.txt"
                          )
                          output.parentFile.mkdirs()
                          output.text = coordinates.join(System.lineSeparator()) + System.lineSeparator()

                          if (coordinates.isEmpty()) {
                              throw new GradleException(
                                  "M22 releaseRuntimeClasspath produced no external module coordinates."
                              )
                          }

                          println("M22 release runtime dependency count=" + coordinates.size())
                          coordinates.each { println("M22_RUNTIME " + it) }
                      }
                  }
              }
          }
          EOF

          gradle --no-daemon \
            -I "$RUNNER_TEMP/m22-runtime-dependencies.init.gradle" \
            :app:exportM22ReleaseRuntimeCoordinates \
            2>&1 | tee m22-runtime-dependencies.log

          test -s build/m22-release-runtime-coordinates.txt

      - name: Build OSV custom lockfile for APK runtime only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          source = Path("build/m22-release-runtime-coordinates.txt")
          packages = []
          seen = set()

          for raw in source.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line:
                  continue
              parts = line.split(":", 2)
              if len(parts) != 3:
                  raise SystemExit(f"Invalid M22 runtime coordinate: {line!r}")
              group, artifact, version = parts
              key = (group, artifact, version)
              if key in seen:
                  continue
              seen.add(key)
              packages.append({
                  "package": {
                      "name": f"{group}:{artifact}",
                      "version": version,
                      "ecosystem": "Maven",
                  }
              })

          if not packages:
              raise SystemExit("M22 runtime OSV lockfile would be empty.")

          output = {
              "results": [
                  {
                      "source": {
                          "path": str(source),
                          "type": "lockfile"
                      },
                      "packages": packages
                  }
              ]
          }

          target = Path("build/m22-runtime-osv-scanner.json")
          target.write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8"
          )
          print(f"M22 runtime OSV package count={len(packages)}")
          PY

          test -s build/m22-runtime-osv-scanner.json

      - name: Scan APK runtime dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --lockfile=osv-scanner:build/m22-runtime-osv-scanner.json

      - name: Audit full Gradle build-tool dependency inventory with OSV
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --lockfile=gradle/verification-metadata.xml

      - name: Verify M22
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_m22_security_release_integrity.py "$GITHUB_WORKSPACE" | tee m22-verify.log

      - name: Verify M21
        run: python3 tools/verify_m21_chaos_recovery.py "$GITHUB_WORKSPACE" | tee m21-verify.log
      - name: Verify M20
        run: python3 tools/verify_m20_net_profit_optimizer.py "$GITHUB_WORKSPACE" | tee m20-verify.log
      - name: Verify M19
        run: python3 tools/verify_m19_learning_governance.py "$GITHUB_WORKSPACE" | tee m19-verify.log
      - name: Verify M18
        run: python3 tools/verify_m18_strategy_truth.py "$GITHUB_WORKSPACE" | tee m18-verify.log
      - name: Verify M17
        run: python3 tools/verify_m17_portfolio_correlation.py "$GITHUB_WORKSPACE" | tee m17-verify.log
      - name: Verify M16
        run: python3 tools/verify_m16_market_microstructure.py "$GITHUB_WORKSPACE" | tee m16-verify.log
      - name: Verify M15
        run: python3 tools/verify_m15_atomic_amend_lifecycle.py "$GITHUB_WORKSPACE" | tee m15-verify.log
      - name: Verify M14
        run: python3 tools/verify_m14_dms_authority_fencing.py "$GITHUB_WORKSPACE" | tee m14-verify.log
      - name: Verify M13
        run: python3 tools/verify_m13_private_execution_ledger.py "$GITHUB_WORKSPACE" | tee m13-verify.log
      - name: Verify M12
        run: python3 tools/verify_m12_order_truth_authority.py "$GITHUB_WORKSPACE" | tee m12-verify.log
      - name: Verify M11
        run: python3 tools/verify_m11_execution_fail_closed.py "$GITHUB_WORKSPACE" | tee m11-verify.log
      - name: Verify M10
        run: python3 tools/verify_m10_champion_degradation.py "$GITHUB_WORKSPACE" | tee m10-verify.log
      - name: Verify M9
        run: python3 tools/verify_m9_champion_challenger.py "$GITHUB_WORKSPACE" | tee m9-verify.log
      - name: Verify M8
        run: python3 tools/verify_m8_ai_adaptive_governance.py "$GITHUB_WORKSPACE" | tee m8-verify.log
      - name: Verify M7
        run: python3 tools/verify_m7_ai_value_attribution.py "$GITHUB_WORKSPACE" | tee m7-verify.log
      - name: Verify M6
        run: python3 tools/verify_m6_selective_ai.py "$GITHUB_WORKSPACE" | tee m6-verify.log
      - name: Verify M5
        run: python3 tools/verify_m5_trade_economics.py "$GITHUB_WORKSPACE" | tee m5-verify.log
      - name: Verify M4
        run: python3 tools/verify_m4_execution_hardening.py "$GITHUB_WORKSPACE" | tee m4-verify.log
      - name: Verify M3.2
        run: python3 tools/verify_m32_kraken_websocket.py "$GITHUB_WORKSPACE" | tee m32-verify.log
      - name: Verify M3
        run: python3 tools/verify_m3_runtime_host.py "$GITHUB_WORKSPACE" | tee m3-verify.log
      - name: Verify canonical source
        run: python3 tools/verify_canonical_v407.py "$GITHUB_WORKSPACE" | tee canonical-verify.log

      - name: Enforce generated dependency checksums
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin 2>&1 | tee compile-debug.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee unit-tests.log

      - name: Assemble verification APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee apk-build.log

      - name: Show controlled M22 diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          {
            git diff --name-only -- app gradle/verification-metadata.xml
            git ls-files --others --exclude-standard -- app gradle/verification-metadata.xml
          } | sort -u | tee m22-files.txt

          if git status --porcelain -- .github/workflows | grep -q .; then
            echo "M22 must not modify protected workflow files inside the generated milestone branch." >&2
            git status --short -- .github/workflows >&2
            exit 1
          fi

      - name: Create M22 branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="milestone/m22-security-release-integrity-${GITHUB_RUN_NUMBER}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            app \
            gradle/verification-metadata.xml
          git diff --cached --quiet && {
            echo "No M22 changes to commit" >&2
            exit 1
          }
          git commit -m "M22 security API-key permissions and release integrity"
          git push --set-upstream origin "$BRANCH"

      - name: Create pull request
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "M22: security, API-key permissions and release integrity" \
            --body "Adds server-side Kraken API-key permission inspection and hard-blocks withdrawal/address-management permissions or missing LIVE permissions. New BUYs require a fresh matching permission assessment; SELL risk reduction remains available. Hardens Android Keystore ciphertext with AES-GCM AAD and synchronous persistence, removes plaintext secret export from normal backups, adds Gradle SHA-256 dependency verification. Protected root workflows are pre-bootstrapped on main and are intentionally not written by the milestone branch."

      - name: PR fallback
        if: steps.pr.outcome != 'success'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          echo "::warning::M22 branch pushed but PR creation was blocked. Open a PR from $BRANCH_NAME into main."

      - name: Upload M22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-M22-security-release-integrity-${{ github.run_number }}
          path: |
            m21-prerequisite.log
            m22-apply.log
            dependency-verification-bootstrap.log
            m22-runtime-dependencies.log
            build/m22-release-runtime-coordinates.txt
            build/m22-runtime-osv-scanner.json
            m22-verify.log
            m21-verify.log
            m20-verify.log
            m19-verify.log
            m18-verify.log
            m17-verify.log
            m16-verify.log
            m15-verify.log
            m14-verify.log
            m13-verify.log
            m12-verify.log
            m11-verify.log
            m10-verify.log
            m9-verify.log
            m8-verify.log
            m7-verify.log
            m6-verify.log
            m5-verify.log
            m4-verify.log
            m32-verify.log
            m3-verify.log
            canonical-verify.log
            compile-debug.log
            unit-tests.log
            apk-build.log
            m22-files.txt
            gradle/verification-metadata.xml
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
