name: M23 Observability Diagnostics Remote Operations

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: read

concurrency:
  group: m23-observability-diagnostics
  cancel-in-progress: false

jobs:
  m23:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Require main dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "M23 must be dispatched from main. Current ref=${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify M22 prerequisite on merged main
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_m22_security_release_integrity.py . | tee m23-prerequisite-m22.log

      - name: Apply M23 controlled payload
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_m23_observability_diagnostics.py . | tee m23-apply.log

      - name: Verify M23
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_m23_observability_diagnostics.py . | tee m23-verifier.log

      - name: Verify M22 through M3 and canonical contracts
        shell: bash
        run: |
          set -euo pipefail
          verifiers=(
            tools/verify_m22_security_release_integrity.py
            tools/verify_m21_chaos_recovery.py
            tools/verify_m20_net_profit_optimizer.py
            tools/verify_m19_learning_governance.py
            tools/verify_m18_strategy_truth.py
            tools/verify_m17_portfolio_correlation.py
            tools/verify_m16_market_microstructure.py
            tools/verify_m15_atomic_amend_lifecycle.py
            tools/verify_m14_dms_authority_fencing.py
            tools/verify_m13_private_execution_ledger.py
            tools/verify_m12_order_truth_authority.py
            tools/verify_m11_execution_fail_closed.py
            tools/verify_m10_champion_degradation.py
            tools/verify_m9_champion_challenger.py
            tools/verify_m8_ai_adaptive_governance.py
            tools/verify_m7_ai_value_attribution.py
            tools/verify_m6_selective_ai.py
            tools/verify_m5_trade_economics.py
            tools/verify_m4_execution_hardening.py
            tools/verify_m32_kraken_websocket.py
            tools/verify_m3_runtime_host.py
            tools/verify_canonical_v407.py
          )
          : > m23-regression-verifiers.log
          for verifier in "${verifiers[@]}"; do
            echo "===== ${verifier} =====" | tee -a m23-regression-verifiers.log
            python "${verifier}" . 2>&1 | tee -a m23-regression-verifiers.log
          done

      - name: Kotlin compile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace | tee m23-kotlin-compile.log

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace | tee m23-unit-tests.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace | tee m23-apk.log

      - name: Verify controlled M23 diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <({ git diff --name-only -- app; git ls-files --others --exclude-standard -- app; } | sort -u)
          printf '%s\n' "${files[@]}" | tee m23-files.txt
          expected=(
            app/src/main/java/com/ksp/cryptobot/core/BotController.kt
            app/src/main/java/com/ksp/cryptobot/exchange/ExchangeClientsV08.kt
            app/src/main/java/com/ksp/cryptobot/execution/AdvancedExecutionCoordinator.kt
            app/src/main/java/com/ksp/cryptobot/observability/M23DecisionLineage.kt
            app/src/main/java/com/ksp/cryptobot/observability/M23DiagnosticBundleExporter.kt
            app/src/main/java/com/ksp/cryptobot/observability/M23Observability.kt
            app/src/main/java/com/ksp/cryptobot/observability/M23RemoteOperations.kt
            app/src/main/java/com/ksp/cryptobot/service/BotForegroundService.kt
            app/src/test/java/com/ksp/cryptobot/observability/M23DiagnosticContractTest.kt
            app/src/test/java/com/ksp/cryptobot/observability/M23RedactionAndLineageTest.kt
            app/src/test/java/com/ksp/cryptobot/observability/M23RemoteOperationsPolicyTest.kt
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/m23-expected.txt
          printf '%s\n' "${files[@]}" | sort > /tmp/m23-actual.txt
          diff -u /tmp/m23-expected.txt /tmp/m23-actual.txt
          if [[ -n "$(git status --porcelain -- .github/workflows)" ]]; then
            echo "Generated milestone branch must not contain workflow changes." >&2
            git status --short -- .github/workflows
            exit 1
          fi

      - name: Create milestone branch and commit
        id: branch
        shell: bash
        env:
          BRANCH_NAME: milestone/m23-observability-diagnostics-${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH_NAME}"
          git add app
          git diff --cached --check
          git commit -m "M23 observability diagnostics and remote operations"
          git push origin "${BRANCH_NAME}"
          echo "name=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Create M23 pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          body=$(cat <<'BODY'
          Implements M23 — Observability, Diagnostics & Remote Operations.

          Safety properties:
          - unified fail-closed health snapshot across runtime/network/recovery/M14/M22/execution/economics;
          - sanitized diagnostics ZIP with manifest + per-file SHA-256 and no raw credential getters;
          - stable candidate → order → fill correlation IDs;
          - authenticated, replay-resistant remote safety operations with durable audit;
          - remote execute/BUY/SELL/resume/mode/risk/security/authority overrides removed;
          - M23 pause/kill enforced at BotController and the final Kraken BUY submission boundary;
          - protective/exit SELL authority is not disabled by M23;
          - remote reconciliation/market refresh routes through existing authoritative M21 recovery logic;
          - no Room schema bump.

          CI verifies M23, every M22→M3 regression verifier, canonical verifier, Kotlin compile, unit tests, and APK assembly.
          BODY
          )
          if ! gh pr create --base main --head "${BRANCH_NAME}" --title "M23 — Observability, Diagnostics & Remote Operations" --body "${body}"; then
            echo "WARNING: Branch pushed, but automatic PR creation was denied by repository/App permissions." >&2
            echo "Create a PR from ${BRANCH_NAME} to main manually." >&2
          fi

      - name: Upload M23 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m23-observability-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            m23-*.log
            m23-files.txt
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/**
