name: M4 Kraken Execution-State Hardening

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cts-m4-execution-hardening
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  CTS_VERSION_NAME: 4.0.7
  CTS_VERSION_CODE: 112

jobs:
  m4:
    name: Patch, verify, compile, test and branch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1 || true)"
          fi
          [ -x "$SDKMANAGER" ] || { echo "sdkmanager missing" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply M4 execution hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_m4_execution_hardening.py "$GITHUB_WORKSPACE" | tee m4-apply.log

      - name: Verify M4 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_m4_execution_hardening.py "$GITHUB_WORKSPACE" | tee m4-verify.log

      - name: Verify M3.2 WebSocket market-data contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_m32_kraken_websocket.py "$GITHUB_WORKSPACE" | tee m32-verify.log

      - name: Verify M3 Android host contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_m3_runtime_host.py "$GITHUB_WORKSPACE" | tee m3-verify.log

      - name: Verify canonical v4.0.7 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_canonical_v407.py "$GITHUB_WORKSPACE" | tee canonical-verify.log

      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin 2>&1 | tee compile-debug.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee unit-tests.log

      - name: Assemble verification APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee apk-build.log

      - name: Show controlled M4 diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          {
            git diff --name-only -- app
            git ls-files --others --exclude-standard -- app
          } | sort -u | tee m4-files.txt

      - name: Create M4 branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="milestone/m4-execution-hardening-${GITHUB_RUN_NUMBER}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app
          git diff --cached --quiet && { echo "No M4 app changes to commit" >&2; exit 1; }
          git commit -m "M4 harden Kraken execution state and order identity"
          git push --set-upstream origin "$BRANCH"

      - name: Create pull request
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH_NAME" \
            --title "M4: harden Kraken execution state" \
            --body "Adds monotonic Kraken nonces, cl_ord_id order identity, authenticated WebSocket v2 executions snapshots/updates, partial-fill tracking, sequence-gap fail-closed recovery, ambiguous AddOrder quarantine, duplicate open-BUY protection, and a LIVE_AUTO entry truth gate. REST reconciliation remains the authoritative recovery fallback; protective SELL exits are not blocked by private-feed availability."

      - name: PR fallback
        if: steps.pr.outcome != 'success'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          echo "::warning::M4 branch pushed but PR creation was blocked. Open a PR from $BRANCH_NAME into $GITHUB_REF_NAME."

      - name: Upload M4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-M4-execution-hardening-${{ github.run_number }}
          path: |
            m4-apply.log
            m4-verify.log
            m32-verify.log
            m3-verify.log
            canonical-verify.log
            compile-debug.log
            unit-tests.log
            apk-build.log
            m4-files.txt
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
