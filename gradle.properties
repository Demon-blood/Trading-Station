# AndroidX is required because this project uses Jetpack Compose, Activity Compose, Lifecycle, Room, and other AndroidX libraries.
android.useAndroidX=true

# Keep Jetifier enabled for compatibility if any future dependency still references old support libraries.
android.enableJetifier=true

# Kotlin/Gradle stability settings for CI builds.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
